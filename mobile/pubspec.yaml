name: dtu_bazaar
description: "DTU Bazaar — Exclusive Campus Peer Marketplace for Delhi Technological University"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management & Architecture
  provider: ^6.1.2

  # Networking & Real-time
  dio: ^5.4.3+1
  http: ^1.2.1
  socket_io_client: ^2.0.3+1

  # Local Storage & Security
  shared_preferences: ^2.2.3

  # Device Hardware & Media
  image_picker: ^1.1.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0
  intl: ^0.19.0
  qr_flutter: ^4.1.0

  # UI & Typography
  google_fonts: ^6.2.1
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
