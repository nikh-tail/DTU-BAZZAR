name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          chmod +x android/gradlew
          flutter build apk --release --split-per-abi=false

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "DTU Bazaar Mobile ${{ github.ref_name }}"
          draft: false
          prerelease: false
          files: release-output/DTU-Bazaar.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
