name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/dtu-bazaar-v2.1.0.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar-v2.1.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "DTU Bazaar Mobile App ${{ github.ref_name }} (Flutter Release)"
          body: |
            ### ⚡ DTU Bazaar — Official Mobile App ${{ github.ref_name }}
            Latest production cross-platform release for Delhi Technological University students & campus community.

            #### 🌟 Highlights:
            - **✨ Redesigned Glassmorphic Onboarding Flow**: 4-digit rapid email verification, unified campus identity setup, and instant confirmation.
            - **🔓 Any Email & Gmail Support**: Instant signup and login with any personal Gmail or university webmail address.
            - **🏷️ SharePal 4-Card Department Grid**: Larger, touch-responsive category cards with representative imagery and bottom accent color bars.
            - **💬 1-Tap WhatsApp & Real-Time Campus Chat**: Negotiate prices directly with peers with 0% brokerage.
            - **📸 Rapid Camera & Gallery Listing**: Post drafters, electronics, books, and cycles within seconds.

            Download `DTU-Bazaar.apk` below and install directly on your Android phone!
          files: |
            release-output/DTU-Bazaar.apk
            release-output/dtu-bazaar-v2.1.0.apk
            release-output/DTU-Bazaar-v2.1.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
