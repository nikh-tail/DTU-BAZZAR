name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/dtu-bazaar-latest.apk
          if [[ "${{ github.ref_name }}" =~ ^v.* ]]; then
            cp mobile/build/app/outputs/flutter-apk/app-release.apk "release-output/dtu-bazaar-${{ github.ref_name }}.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "DTU Bazaar Mobile App ${{ github.ref_name }} (Flutter Release)"
          body: |
            ### ⚡ DTU Bazaar — Official Mobile App ${{ github.ref_name }}
            Latest production release for Delhi Technological University students & campus community.

            #### 🌟 Highlights in ${{ github.ref_name }}:
            - **🔄 In-App OTA Auto-Updater**: Automated in-app update notifications with 1-tap direct install — no need to manually visit GitHub for future updates!
            - **📸 User Product Photos Fixed**: Multi-part image upload now accurately captures and displays photos published by users across the marketplace, details, and profile.
            - **🔢 Strict OTP Verification**: OTP validation strictly verifies the exact entered code without false bypass fallbacks.
            - **🎨 100% Relevant Category Photos**: Updated categories (Fashion, Hostel Essentials, Electronics, Books, Sports) with relevant campus photos.
            - **⚡ Fast Chat Launch & Zero Message Duplication**: Real-time message deduplication and instant tactile feedback when opening chats.
            - **☀️ Clean Light Theme**: Normal DTU Bazaar light UI across Auth, Registration, and Onboarding.

            Download `DTU-Bazaar.apk` below and install directly on your Android device!
          files: release-output/*
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
