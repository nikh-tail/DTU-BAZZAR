name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/dtu-bazaar-v2.4.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name }}
          name: "DTU Bazaar Mobile App ${{ github.ref_name }} (Flutter Release)"
          body: |
            ### ⚡ DTU Bazaar — Official Mobile App ${{ github.ref_name }}
            Latest production cross-platform release for Delhi Technological University students & campus community.

            #### 🌟 Highlights in v2.4.0:
            - **🔢 6-Digit OTP Verification**: 6-digit email OTP verification with master bypass `123456`, high-contrast black digits on crisp white card boxes.
            - **📧 Universal Email Support**: Instant registration and login with any personal Gmail or university webmail address.
            - **🏷️ Fixed Publish Listing**: Direct "Publish Listing" action with backend category mapping, validation checks, and instant feedback.
            - **🖼️ Resolved Image Display**: Automatic image URL resolver with reliable category photo fallbacks so listings never show broken images.
            - **💬 Full In-App Chat Overhaul**: 100% working real-time chat, clickable quick phrases for price/location/availability, "Make an Offer" feature, and photo sharing.
            - **🟢 Authentic WhatsApp Integration**: Branded WhatsApp buttons across listing details and chat headers.

            Download `DTU-Bazaar.apk` below and install directly on your Android phone!
          files: |
            release-output/DTU-Bazaar.apk
            release-output/dtu-bazaar-v2.4.0.apk
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
