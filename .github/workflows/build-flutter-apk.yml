name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    branches:
      - main
    paths:
      - 'mobile/**'
      - '.github/workflows/build-flutter-apk.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Release APK
        run: |
          cd mobile
          flutter build apk --release

      - name: Rename APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0-flutter
          name: "DTU Bazaar Mobile App v1.0.0 (Flutter)"
          body: |
            ### ⚡ DTU Bazaar — Exclusive Campus Peer Marketplace
            Official Flutter Cross-Platform Release APK for Android.

            #### 🌟 What's Inside:
            - **SharePal 2-Column Campus Categories Grid** with touch color-reveal and 8px accent strips
            - **Live Campus Marketplace Feed** with real-time filters & instant search
            - **1-Tap WhatsApp Direct Messaging** with pre-filled deal greetings
            - **Live WebSocket Real-time Chat** with instant offer bargaining
            - **Campus Seller Wizard** with multi-image camera/gallery picker
            - **Student Profile** with verified DTU student badge & active/sold/saved tabs

            Download `DTU-Bazaar.apk` below and install directly on your Android device!
          files: release-output/DTU-Bazaar.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
