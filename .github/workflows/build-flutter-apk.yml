name: Build & Release DTU Bazaar Flutter APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Flutter Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK) 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Install Mobile Dependencies
        run: |
          cd mobile
          flutter pub get

      - name: Build Android Release APK
        run: |
          cd mobile
          chmod +x android/gradlew
          flutter build apk --release --no-tree-shake-icons

      - name: Stage APK for Release
        run: |
          mkdir -p release-output
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/DTU-Bazaar.apk
          cp mobile/build/app/outputs/flutter-apk/app-release.apk release-output/dtu-bazaar-v2.0.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dtu-bazaar-flutter-apk
          path: release-output/DTU-Bazaar.apk

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0.0-flutter
          name: "DTU Bazaar Mobile App v2.0.0 (Flutter)"
          body: |
            ### ⚡ DTU Bazaar — Official Flutter Mobile App (v2.0.0)
            Brand new cross-platform Flutter release for Delhi Technological University students.

            #### 🌟 Highlights in Flutter v2.0.0:
            - **SharePal 2-Column Campus Categories Grid** with interactive touch color-reveal and 8px solid accent strips
            - **1-Tap WhatsApp Direct Messaging** with pre-filled campus meetup template
            - **Live Real-Time Socket.io Chat** with instant price offer negotiation
            - **Multi-Photo Lightbox** with pinch-to-zoom and swipe controls
            - **Campus Seller Wizard** with camera & gallery picker
            - **Verified Student Profiles** with active/sold/wishlist tabs and Pro Seller badge

            Download `DTU-Bazaar.apk` below and install directly on your Android phone!
          files: |
            release-output/DTU-Bazaar.apk
            release-output/dtu-bazaar-v2.0.0.apk
          draft: false
          prerelease: false
          overwrite: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
